name: Editorial polish QA
on:
  push:
    branches: ["qa/editorial-polish-20261124"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx --no-install eslint components/editorial/*.js components/CaseStudyPage.js
      - run: npm run build
      - run: |
          npm install --prefix /tmp/editorial-qa --no-audit --no-fund playwright@1.58.2
          /tmp/editorial-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify titles, vector icons, layout and motion
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/editorial-next.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; tail -80 /tmp/editorial-next.log' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          node scripts/editorial-polish-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-polish-evidence
          path: qa-evidence/
          if-no-files-found: ignore
          retention-days: 7
