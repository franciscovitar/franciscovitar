name: Editorial Engineering candidate QA
on:
  push:
    branches: ["qa/editorial-engineering-v13-20261124"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Focused lint
        run: npx --no-install eslint app/page.js app/genova/page.js app/sitemap.js components/CaseStudyPage.js components/home/EditorialHeader.js components/home/EditorialHero.js components/home/EditorialMotion.js components/home/EngineeringPhilosophy.js components/home/GenovaExperience.js
      - run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/editorial-qa --no-audit --no-fund playwright@1.58.2
          /tmp/editorial-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Test compiled site
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/editorial-next.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; tail -80 /tmp/editorial-next.log' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          node scripts/editorial-qa.cjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-visual-evidence
          path: qa-evidence/
          if-no-files-found: ignore
          retention-days: 7
